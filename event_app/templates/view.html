<!DOCTYPE html>
<html>
<head>
    <title>Participants</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }
        h2 {
            text-align: center;
        }
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            text-align: center;
        }
        th {
            background-color:black;
            color: white;
        }
        tr:nth-child(even) {
            background-color:white;
        }
        tr:hover {
            background-color: lightcyan;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Registered Participants</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Domain</th>
        </tr>
        {% for row in rows %}
        <tr>
            <td>{{ row["id"] }}</td>
            <td>{{ row["name"] }}</td>
            <td>{{ row["email"] }}</td>
            <td>{{ row["domain"] }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/">Home</a>
</body>
</html>
