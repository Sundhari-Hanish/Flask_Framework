<!DOCTYPE html>
<html>
<head>
    <title>Users</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        table {
            border-collapse: collapse;
            width: 50%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #667eea;
            color: white;
        }
    </style>
</head>
<body>
<h2>Registered Users</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Username</th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
    </tr>
    {% endfor %}
</table>
<br>
<a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</body>
</html>
