{% extends "base.html" %}
{% block content %}
<h1>Login</h1>

<form method="post">
{{ form.hidden_tag() }}

<p>
{{ form.username.label }}<br>
{{ form.username() }}
</p>

<p>
{{ form.password.label }}<br>
{{ form.password() }}
</p>

<p>
{{ form.remember_me() }} {{ form.remember_me.label }}
</p>

<p>{{ form.submit() }}</p>

</form>

<p>New User? <a href="{{ url_for('register') }}">Register here</a></p>

{% endblock %}
